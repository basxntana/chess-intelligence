[project]
name = "chess-intelligence-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "anthropic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "chess"]  # chess = python-chess, reference for tests only

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
