services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess  # dev only
      POSTGRES_DB: chess_intelligence
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  backend:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://chess:chess@db:5432/chess_intelligence
    ports: ["8000:8000"]
    depends_on: [db]

volumes:
  pgdata:
